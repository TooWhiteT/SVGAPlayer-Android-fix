apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'


android {
    namespace 'com.opensource.svgaplayer'
    compileSdkVersion 35
    testOptions {
        unitTests.includeAndroidResources = true
    }
    sourceSets {
        test.resources.srcDir "${rootProject.projectDir}/app/src/main/assets"
        test.assets.srcDir "${rootProject.projectDir}/app/src/main/assets"
    }
    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 35
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    packagingOptions {
        exclude 'META-INF/ASL2.0'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/MANIFEST.MF'
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
        moduleName = 'com.opensource.svgaplayer'
    }
}

dependencies {
    implementation 'com.squareup.wire:wire-runtime:4.4.1'
    implementation 'com.squareup.okio:okio:3.0.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
