apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'maven-publish'

group = 'com.github.TooWhiteT'
version = providers.gradleProperty('releaseVersion')
        .orElse(providers.environmentVariable('VERSION'))
        .orElse('v1.0.0').get()

android {
    namespace 'com.opensource.svgaplayer'
    compileSdkVersion 35
    testOptions {
        unitTests.includeAndroidResources = true
    }
    sourceSets {
        test.resources.srcDir "${rootProject.projectDir}/app/src/main/assets"
        test.assets.srcDir "${rootProject.projectDir}/app/src/main/assets"
        androidTest.assets.srcDir "${rootProject.projectDir}/app/src/main/assets"
    }
    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 35
        testInstrumentationRunner 'com.opensource.svgaplayer.SVGAMemoryStressInstrumentation'
    }
    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    packagingOptions {
        exclude 'META-INF/ASL2.0'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/MANIFEST.MF'
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
        moduleName = 'com.opensource.svgaplayer'
    }
}

dependencies {
    // Keep a low Lifecycle baseline; consuming apps can resolve their newer version.
    api 'androidx.lifecycle:lifecycle-runtime:2.6.2'
    implementation 'com.squareup.wire:wire-runtime:4.4.1'
    implementation 'com.squareup.okio:okio:3.0.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = project.group.toString()
                artifactId = 'SVGAPlayer-Android-fix'
                version = project.version.toString()
                pom {
                    name = 'SVGAPlayer Android Fix'
                    description = 'Android SVGA animation player with lifecycle-aware playback and bounded resource usage.'
                    url = 'https://github.com/TooWhiteT/SVGAPlayer-Android-fix'
                    licenses {
                        license {
                            name = 'The Apache License, Version 2.0'
                            url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                            distribution = 'repo'
                        }
                    }
                    scm {
                        url = 'https://github.com/TooWhiteT/SVGAPlayer-Android-fix'
                        connection = 'scm:git:https://github.com/TooWhiteT/SVGAPlayer-Android-fix.git'
                    }
                }
            }
        }
    }
}
